items:
  - date: 2026-07-01
    title: Fall Yard Sale
    description: The annual PHNA Fall Yard Sale is this Saturday, September 12,
      starting at 7 AM! Use our [digital
      map](https://www.google.com/maps/d/viewer?mid=1ppea5hfS-1zHXxLcYS3UQ3IxpUcQlDA&usp=sharing)
      to navigate the yard sale locations!
    author: Mark Richter
    category: Events
  - date: 2026-09-07
    title: September Happy Hour
    description: Join PHNA and your neighbors Thursday, September 17 from 5-7 PM for
      happy hour! We'll be at JJ Twig's Pizza & Pub at 5600 Hampton Ave.; we
      hope to be on the patio, weather-permitting.
    author: Mark Richter
    category: Events
  - date: 2026-09-07
    title: Century Home Plaque Pickup
    description: "Century home plaques were distributed at our general meeting on
      September 3. If you didn't make it to the meeting, we’ll still have them
      for you at the October 1 meeting. Once again, for those who ordered
      plaques, we thank you for your support of this project. "
    author: Mark Richter
    category: Announcements
