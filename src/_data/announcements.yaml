items:
  - date: 2026-08-11
    title: September General Meeting
    description: Join us for our next meeting, Thursday, September 3 at 7 PM, at
      Bethel Church, 5401 S. Kingshighway. Our special guest speaker will be
      Niraj Patel, Director of Public Utilities and Water Commissioner for the
      City of St. Louis.
    author: Mark Richter
    category: Events
  - date: 2026-08-29
    title: Century Home Plaque Pickup
    description: "Century home plaques are ready for pickup this Thursday, at our
      general meeting! If you can’t make it to the meeting, we’ll still have
      them for you at the October meeting. Once again, for those who ordered
      plaques, we thank you for your support of this project. "
    author: Mark Richter
    category: Announcements
  - date: 2026-07-01
    title: Fall Yard Sale Signup
    description: Mark your calendar for the annual PHNA Fall Yard Sale - Saturday,
      September 12! [Sign up here](https://forms.gle/33ykhaS2D1xk48z46) to
      participate! Prior to the yard sale date, we will offer both digital and
      print versions of the map. The sale starts at 7 AM on the 12th.
    author: Mark Richter
    category: Announcements
