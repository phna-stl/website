items:
  - date: 2026-10-07
    description: PHNA’s second annual Trunk-or-Treat is Thursday, October 22! Join
      us at Our Lady of Sorrows, starting from 5:30 - 7 PM. [Register now](
      https://docs.google.com/forms/d/e/1FAIpQLScO2JqH97Iac-ZZtssS57ch40FX_AV07G7hhYFbkq69QYe9zA/viewform?usp=sharing&ouid=115276479942452189443)
      to secure one of only 25 reserved spots. Registration is on a first come,
      first served basis. Registration is NOT required for trick-or-treaters!
    title: PHNA Trunk-or-Treat
    author: Mark Richter
    category: Events
  - date: 2026-10-16
    title: Electronics Recycling Event
    description: >-
      Saint Louis City Recycles, in partnership with MRC - Certified Electronics
      Recycling, is hosting another Electronics Recycling and Document
      Destruction Event on October 24! It's from 8-11 AM at 

      the city's water division, 1640 S. Kingshighway. This event is FREE for City residents with ID. Get more information on the [Saint Louis City Recycles website](https://stlcityrecycles.com/event/electronics-recycling-event-hosted-by-saint-louis-city-recycles/?fbclid=IwY2xjawU-7JZleHRuA2FlbQIxMABwZG9mAWJyaWQRMVgxVVc2RmV0MlduNk5yYjVzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEeq6MUZmZhRLfXjt-5Ie9z78fylyNm_lG50DAOYquijig1kpTpc63mTQzNO8U_aem_B3jt71WWGLKR6Ykl9UIsIA).
    author: Mark Richter
    category: Announcements
  - date: 2026-09-20
    title: Volunteers Wanted!
    description: "We’re looking for neighbors who are interested in getting involved
      with the PHNA board! We’re especially interested in people with experience
      or an interest in financial management, communications, event planning,
      and community outreach. Interested? [Send us an
      email](mailto:info@phna-stl.org) to learn more. "
    author: Mark Richter
    category: Announcements
