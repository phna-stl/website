items:
  - date: 2026-10-30
    description: Our next general meeting will be held Thursday, November 5, at 7 PM
      at Valor Villages (formerly Bethel Church), 5401 South Kingshighway Blvd.
      We hope you’ll join us for a state-of-the neighborhood association
      address, as well as many other neighborhood updates.
    title: November General Meeting
    author: Mark Richter
    category: Events
  - date: 2026-11-02
    description: Back by popular demand, we’re re-opening ordering for century home
      plaques! They are once again available in the [PHNA website
      store](https://phna-stl.square.site/), through December 1. Designed by
      PHNA and created by The Done Dept., each plaque is made from aluminum,
      8"x8" in size and comes with pre-drilled holes for installation.
    title: Century Home Plaques are Back!
    author: Mark Richter
    category: Announcements
  - date: 2026-10-30
    title: Membership Renewals
    description: It's membership renewal time! Renew now, and your membership is
      good through the end of 2027. We've made it simple for you; go to [our
      website store](https://phna-stl.square.site/) or mail your renewal to PHNA
      at 5401 South Kingshighway Blvd., St. Louis, MO 63109. We can also handle
      renewals in person at the November general meeting.
    author: Mark Richter
    category: Announcements
