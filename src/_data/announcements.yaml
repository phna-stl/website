items:
  - date: 2026-10-05
    title: October Happy Hour
    description: >
      Join PHNA and your neighbors for happy hour at Onesto Pizza & Trattoria,
      Thursday, October 15 from 5-7 PM! We really, really hope the weather
      cooperates, so we can hang out on the patio! If you haven't yet picked up
      your century home plaque, you can do so during happy hour.
    author: Mark Richter
    category: Events
  - date: 2026-09-07
    title: Century Home Plaque Pickup
    description: "We still have some century home plaques that haven't been picked
      up. The next opportunity for pickup is at our October happy hour at
      Onesto, October 15 from 5-7 PM. Once again, for those who ordered plaques,
      we thank you for your support of this project. "
    author: Mark Richter
    category: Announcements
  - date: 2026-09-20
    title: Volunteers Wanted!
    description: "We’re looking for neighbors who are interested in getting involved
      with the PHNA board! We’re especially interested in people with experience
      or an interest in financial management, communications, event planning,
      and community outreach. Interested? [Send us an
      email](mailto:info@phna-stl.org) to learn more. "
    author: Mark Richter
    category: Announcements
