items:
  - date: 2026-09-20
    title: October General Meeting
    description: Our next general meeting will be held Thursday, October 1, at 7:00
      PM at Bethel Church, 5401 South Kingshighway. We’ll have more information
      about our guest speakers soon, so stay tuned! Also, we will have century
      home plaques on hand, if you have yet to pick yours up.
    author: Mark Richter
    category: Events
  - date: 2026-09-07
    title: Century Home Plaque Pickup
    description: "Century home plaques were distributed at our general meeting on
      September 3. If you didn't make it to the meeting, we’ll still have them
      for you at the October 1 meeting. Once again, for those who ordered
      plaques, we thank you for your support of this project. "
    author: Mark Richter
    category: Announcements
  - date: 2026-09-20
    title: Volunteers Wanted!
    description: "We’re looking for neighbors who are interested in getting involved
      with the PHNA board! We’re especially interested in people with experience
      or an interest in financial management, communications, event planning,
      and community outreach. Interested? [Send us an
      email](mailto:info@phna-stl.org) to learn more. "
    author: Mark Richter
    category: Announcements
