items:
  - date: 2026-10-30
    description: Our next general meeting will be held Thursday, November 5, at 7 PM
      at Bethel Church, 5401 South Kingshighway Blvd. We hope you’ll join us for
      a state-of-the neighborhood association address, as well as many other
      neighborhood updates.
    title: November General Meeting
    author: Mark Richter
    category: Events
  - date: 2026-10-30
    title: Volunteers Wanted!
    description: "We’re still looking for volunteers to join the Board, especially
      those with interest in financial management (formal experience not
      necessary!). Most importantly, we’re looking for people who want to get
      involved in the community! If you have any interest, [contact
      us](mailto:info@phna-stl.org) to learn more. "
    author: Mark Richter
    category: Announcements
  - date: 2026-10-30
    title: Membership Renewals
    description: t's membership renewal time! Renew now, and your membership is good
      through the end of 2027. We've made it simple for you; go to [our website
      store](https://phna-stl.square.site/) or mail your renewal to PHNA at 5401
      South Kingshighway Blvd., St. Louis, MO 63109. We can also handle renewals
      in person at the November general meeting.
    author: Mark Richter
    category: Announcements
