items:
  - date: 2026-08-11
    title: September General Meeting
    description: Join us for our next meeting, Thursday, September 3 at 7 PM, at
      Bethel Church, 5401 S. Kingshighway. Our special guest speaker will be
      Niraj Patel, Director of Public Utilities and Water Commissioner for the
      City of St. Louis.
    author: Mark Richter
    category: Events
  - date: 2026-07-01
    title: Fall Yard Sale Signup
    description: Mark your calendar for the annual PHNA Fall Yard Sale - Saturday,
      September 12! [Sign up here](https://forms.gle/33ykhaS2D1xk48z46) to
      participate! Prior to the yard sale date, we will offer both digital and
      print versions of the map.
    author: Mark Richter
    category: Announcements
  - date: 2026-06-29
    title: Princeton Heights Book
    description: Author and historian Jay Unnerstall is partnering with PHNA to
      produce a book chronicling the history of Princeton Heights! Call or text
      him at 314-476-8870, or email him at jayunnerstall@gmail.com, to share
      personal stories, historical photos, or other information about the
      neighborhood.
    author: Mark Richter
    category: Announcements
