items:
  - date: 2026-09-07
    title: September Happy Hour
    description: Join PHNA and your neighbors Thursday, September 17 from 5-7 PM for
      happy hour! We'll be at JJ Twig's Pizza & Pub at 5600 Hampton Ave.; we
      hope to be on the patio, weather permitting. If you weren’t able to pick
      up your century home plaque at our September meeting, you can get it at
      our happy hour!
    author: Mark Richter
    category: Events
  - date: 2026-09-07
    title: Century Home Plaque Pickup
    description: "Century home plaques were distributed at our general meeting on
      September 3. If you didn't make it to the meeting, we’ll still have them
      for you at the October 1 meeting. You can also pick them up at our
      September happy hour (September 17 at JJ Twigs, from 5-7 PM). Once again,
      for those who ordered plaques, we thank you for your support of this
      project. "
    author: Mark Richter
    category: Announcements
  - date: 2026-09-12
    description: Author and historian Jay Unnerstall is partnering with PHNA to
      produce a book chronicling the history of Princeton Heights! Call or text
      him at 314-476-8870, or email him at jayunnerstall@gmail.com, to share
      personal stories, historical photos, or other information about the
      neighborhood.
    title: Princeton Heights Book
    author: Mark Richter
    category: Announcements
